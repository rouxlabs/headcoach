    --team-0: #22d3ee; --team-1: #e879f9; --team-2: #4ade80; --team-3: #60a5fa; --team-4: #fbbf24; --team-5: #a78bfa;

.turn.agent { margin-right: 6%; background: var(--agent-bg); border: 1px solid var(--agent-line); border-left: 5px solid var(--run); border-radius: 8px; }
.turn.agent .who, .turn.md .who { background: var(--run); color: var(--on-accent); }
.turn.tool { margin: -6px 6% -6px 28px; padding: 5px 10px; border: 1px solid var(--tool-line); border-left: 5px solid var(--done); border-radius: 0; background: var(--tool-bg); color: var(--fg); font-size: 12px; }
.turn.tool + .turn.tool { margin-top: -15px; border-top: 0; }
.turn.tool .who { display: none; }
.turn.tool::before { content: "TOOL"; display: inline-block; font-family: var(--sans); font-size: 10px; font-weight: 600; letter-spacing: .08em; background: var(--done); color: var(--on-accent); border-radius: 3px; padding: 0 6px; margin-right: 8px; }
.turn.ask .who, .turn.from .who { background: var(--need); color: var(--on-accent); }
.turn.md { white-space: normal; font-size: 14px; line-height: 1.6; padding: 12px 14px; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p, .md ul, .md ol, .md pre, .md blockquote, .md table { margin: 0 0 12px; }
.md h1, .md h2, .md h3, .md h4 { font-weight: 600; text-wrap: balance; color: var(--accent); }
.md h1, .md h2 { font-size: 16px; margin: 22px 0 10px; padding: 6px 10px; background: var(--surface); border-left: 3px solid var(--accent); border-radius: 0 6px 6px 0; }
.md h3, .md h4 { font-size: 14px; margin: 16px 0 6px; color: var(--rev); }
.md strong { color: var(--fg); font-weight: 600; }
.md p > strong:first-child { color: var(--done); }
.md ul, .md ol { padding-left: 22px; }
.md li { margin: 4px 0; }
.md li::marker { color: var(--accent); }
.md li > ul, .md li > ol { margin: 4px 0; }
.md code { font-family: var(--mono); font-size: 12.5px; color: var(--need); background: var(--need-bg); border-radius: 4px; padding: 1px 5px; }
.md h1 code, .md h2 code, .md h3 code { color: inherit; background: none; padding: 0; font-size: inherit; }
.md pre { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; overflow-x: auto; }
.md pre code { color: var(--fg); background: none; padding: 0; }
.md blockquote { border-left: 3px solid var(--done); background: var(--surface); border-radius: 0 6px 6px 0; padding: 8px 12px; color: var(--fg); }
.md blockquote p { margin-bottom: 6px; }
.md blockquote p:last-child { margin-bottom: 0; }
.md a { color: var(--accent); }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
.md table { border-collapse: collapse; display: block; overflow-x: auto; max-width: 100%; }
.md th, .md td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; vertical-align: top; }
.md th { background: var(--panel); font-weight: 600; color: var(--accent); }
.d-head input { flex: 1; min-width: 0; font-size: 16px; font-weight: 600; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
/* The keys under the terminal are repeated above the reply box, for a phone only. */
.reply .keys { display: none; }

/* Phone: one list grouped by state, the most urgent first, and a full-screen drawer sized to what the
   keyboard leaves visible. iOS zooms in on a field under 16px, and a finger needs 44px. */
@media (max-width: 640px) {
  body { padding: 12px 12px 24px; }
  input, select, textarea, .d-head input, .panel textarea, .panel input, .panel select { font-size: 16px; }
  .btn, .btn.small, select, .sort select, .moverow select { min-height: 44px; min-width: 44px; }
  .top { gap: 10px 14px; }
  .top .seg { display: none; }
  .top .grow { flex-basis: 100%; order: 1; height: 0; }
  .top .attn, #usage, #limits { order: 2; }
  .top .sort, #newbtn { order: 3; }
  #newbtn { margin-left: auto; }
  .tag { line-height: 22px; }
  a.tag { display: inline-flex; align-items: center; min-height: 44px; padding: 0 10px; }

  .board { display: flex; flex-direction: column; gap: 16px; overflow: visible; }
  .col { background: none; border: 0; }
  .col:has(> .cards > .empty) { display: none; }
  .col.s-needs { order: 1; } .col.s-running { order: 2; } .col.s-review { order: 3; }
  .col.s-backlog { order: 4; } .col.s-parked { order: 5; } .col.s-done { order: 6; }
  .col-head { padding: 0 2px 6px; }
  .cards { padding: 0; min-height: 0; }
  .card { padding: 12px; }

  .drawer {
    top: var(--vv-top, 0px); left: 0; right: 0; bottom: auto; height: var(--vv-height, 100dvh); width: auto; transform: none;
    border: 0; border-radius: 0; box-shadow: none;
  }
  .d-head { padding: 8px 12px; align-items: center; }
  .d-body { padding: 12px; }
  .d-body > * { min-width: 0; }
  .d-body .keys { display: none; }
  .moverow { flex-wrap: wrap; }
  .team { overflow-x: auto; }
  .turn.you { margin-left: 8%; }
  .turn.agent { margin-right: 0; }
  .turn.tool { margin-right: 0; margin-left: 12px; }
  .reply { padding: 8px 12px; gap: 6px; }
  .reply textarea { min-height: 44px; height: 44px; resize: none; }
  .reply .keys { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin: 0; }
  .reply .keys .btn { min-width: 0; }
  .reply .row { flex-wrap: nowrap; }
  .reply .hint { font-size: 11px; line-height: 1.3; }
}
</style>
</head>
<body>
<header class="top">
  <h1>headcoach</h1>
  <span class="conn" id="conn"><span class="dot"></span><span id="conn-text">connecting</span></span>
  <span class="grow"></span>
  <span class="attn" id="attn"></span>
  <span id="usage" title="Tokens of every task on the board"></span>
  <span id="limits"></span>
  <label class="sort">Sort <select id="sortby">
    <option value="state">by state</option><option value="idle">by idle time</option><option value="cost">by cost</option><option value="tokens">by tokens used</option><option value="ctx">by context size</option>
  </select></label>
  <label class="sort">Theme <select id="palette"></select></label>
  <div class="seg" role="group" aria-label="View">
    <button class="btn" type="button" data-view="board">Board</button>
    <button class="btn" type="button" data-view="list">List</button>
  </div>
  <button class="btn primary" id="newbtn" type="button">New task</button>
</header>

<form class="panel" id="newpanel" hidden>
  <label class="label" for="new-prompt">What should the agent do?</label>
  <textarea id="new-prompt" required placeholder="Describe the task. This becomes the first prompt of the session."></textarea>
  <div class="row">
    <label>Directory
      <input id="new-dir" list="dirs" placeholder="~/code/..." autocomplete="off">
      <datalist id="dirs"></datalist>
    </label>
    <label class="narrow">Profile
      <select id="new-profile"></select>
    </label>
  </div>
  <div class="actions">
    <button class="btn primary" type="submit" data-start="1">Add and start</button>
    <button class="btn" type="submit" data-start="">Add to backlog</button>
    <button class="btn" type="button" id="newcancel">Cancel</button>
  </div>
</form>

<main class="board" id="board"></main>
<div id="overlay"></div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
const STATES = [
  { id: "backlog", name: "Backlog" }, { id: "running", name: "Running" }, { id: "needs", name: "Needs me" },
  { id: "review", name: "Review" }, { id: "parked", name: "Parked" }, { id: "done", name: "Done" }
];
const ORDER = ["needs", "running", "review", "backlog", "parked", "done"];
const POLL_MS = 2000;

let tasks = [], detail = null, team = null, openId = null, dragId = null, view = "board";
let boardSig = "", detailSig = "", loaded = false, confirmDelete = false, editingTitle = false;
try { if (localStorage.getItem("view") === "list") view = "list"; } catch (err) {}
let sortBy = "state";
const PALETTES = ["terminal", "bright", "nord", "k9s"];
// palette is the theme picked in the menu, kept by this browser; empty follows the config's theme.
let palette = "", configTheme = "terminal";
try { palette = localStorage.getItem("palette") || ""; configTheme = localStorage.getItem("config-palette") || "terminal"; } catch (err) {}
try { sortBy = ["idle", "cost", "tokens", "ctx"].includes(localStorage.getItem("sort")) ? localStorage.getItem("sort") : "state"; } catch (err) {}

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const stateName = id => STATES.find(s => s.id === id).name;

function human(sec) {
  if (sec < 60) return sec + "s";
  if (sec < 3600) return Math.floor(sec / 60) + " min";
  if (sec < 86400) return Math.floor(sec / 3600) + " h " + String(Math.floor(sec % 3600 / 60)).padStart(2, "0");
  return Math.floor(sec / 86400) + " d";
}
function count(n) {
  for (const [limit, unit] of [[1e9, "G"], [1e6, "M"], [1e3, "k"]]) {
    if (n >= limit) { const v = n / limit; return (v < 10 ? v.toFixed(1) : v.toFixed(0)) + unit; }
  }
  return String(n);
}
const tokenTitle = k => `Tokens: ${k.in} in, ${k.out} out, ${k.cache_read} read from cache, ${k.cache_write} written to cache`;
function tokensHtml(k) {
  if (!k || !(k.in + k.out + k.cache_read + k.cache_write)) return "";
  return `<span class="tok" title="${tokenTitle(k)}">in ${count(k.in)} · out ${count(k.out)} · cache ${count(k.cache_read + k.cache_write)}</span>`;
}
function ctxHtml(c) {
  if (!c || !c.tokens) return "";
  const level = c.pct >= 80 ? "hot" : c.pct >= 50 ? "warm" : "ok";
  return `<span class="ctx ${level}" title="Context: ${c.tokens} of ${c.window} tokens"><span class="bar"><span style="width:${c.pct}%"></span></span>${count(c.tokens)} ${c.pct}%</span>`;
}
const money = usd => !usd ? "" : "$" + (usd < 10 ? usd.toFixed(2) : usd < 100 ? usd.toFixed(1) : usd.toFixed(0));
const costHtml = t => t.cost ? `<span class="tok" title="What Claude Code prices this task at, at API rates">${money(t.cost)}</span>` : "";
const total = t => { const k = t.tokens || {}; return (k.in || 0) + (k.out || 0) + (k.cache_read || 0) + (k.cache_write || 0); };
// Pinned tasks go first whatever the order, the one pinned first on top; the others keep their order.
const pinFirst = list => list.slice().sort((a, b) => b.pinned - a.pinned || a.pinned_at - b.pinned_at);
function sorted(list) {
  if (sortBy === "idle") return pinFirst(list.slice().sort((a, b) => a.idle - b.idle));
  if (sortBy === "cost") return pinFirst(list.slice().sort((a, b) => (b.cost || 0) - (a.cost || 0)));
  if (sortBy === "tokens") return pinFirst(list.slice().sort((a, b) => total(b) - total(a)));
  if (sortBy === "ctx") return pinFirst(list.slice().sort((a, b) => ((b.context || {}).tokens || 0) - ((a.context || {}).tokens || 0)));
  return pinFirst(list.slice().sort((a, b) => ORDER.indexOf(a.state) - ORDER.indexOf(b.state) || a.idle - b.idle));
}
function renderLimits(limits) {
  const several = new Set(limits.map(l => l.profile)).size > 1;  // one account needs no name
  $("#limits").innerHTML = limits.map(l => {
    const warn = l.limit_in === null || l.limit_in === undefined ? ""
      : `<span class="limit-warn">${esc(l.profile)} ${l.label} limit ${l.limit_in <= 0 ? "reached" : "in about " + human(l.limit_in)}</span>`;
    return `<span class="ctx ${l.level}${l.stale ? " stale" : ""}" title="${esc(l.profile)}: ${l.pct}% of the ${l.label} limit used, resets in ${human(l.resets_in)}${l.stale ? " (not updated lately)" : ""}"><span class="who">${several ? esc(l.profile) + " " : ""}${l.label}</span><span class="bar"><span style="width:${l.pct}%"></span></span>${l.pct}%</span>${warn}`;
  }).join("");
}
function clock(at) {
  const d = new Date(at * 1000), today = new Date().toDateString() === d.toDateString();
  const hm = d.toTimeString().slice(0, 5);
  return today ? hm : d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + " " + hm;
}

async function api(method, path, data) {
  const res = await fetch(path, { method, headers: { "Content-Type": "application/json" }, body: data ? JSON.stringify(data) : undefined });
  const json = await res.json().catch(() => ({}));
  if (res.status === 401) showPair();
  if (!res.ok) throw Object.assign(new Error(json.error || `The daemon answered ${res.status}`), { status: res.status });
  return json;
}

function applyPalette() {
  const name = PALETTES.includes(palette) ? palette : PALETTES.includes(configTheme) ? configTheme : "terminal";
  if (name === "terminal") delete document.documentElement.dataset.palette;
  else document.documentElement.dataset.palette = name;
  const menu = $("#palette");
  menu.innerHTML = `<option value="" title="The theme of the config">${esc(configTheme)} (config)</option>` + PALETTES.map(p => `<option>${p}</option>`).join("");
  menu.value = PALETTES.includes(palette) ? palette : "";
}

/* ---------- pairing ---------- */

let pairing = false;
function showPair() {
  if (pairing) return;
  pairing = true;
  const el = document.createElement("div");
  el.className = "pair";
  el.innerHTML = `<form autocomplete="off">
    <img src="/icon.svg" alt="">
    <h1>Pair this device</h1>
    <p>On the computer running headcoach, run <code>hc pair &lt;name&gt;</code>, then type the code it prints.</p>
    <input name="code" inputmode="text" maxlength="9" placeholder="XXXX-XXXX" autocapitalize="characters" required>
    <button>Pair</button>
    <p class="err" role="alert"></p>
  </form>`;
  document.body.append(el);
  const form = el.querySelector("form");
  form.code.focus();
  form.addEventListener("submit", async e => {
    e.preventDefault();
    try {
      await api("POST", "/api/pair", { code: form.code.value });
      location.reload();
    } catch (err) { el.querySelector(".err").textContent = err.message; form.code.select(); }
  });
}
let toastTimer = null;
function toast(msg) {
  const el = $("#toast"); el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 5000);
}
async function act(fn) {
  try { await fn(); } catch (err) { toast(err.message); }
  await refresh(true);
}

/* ---------- board and list ---------- */

function kidsHtml(t, extra) {
  if (!t.agents || !t.agents.length) return "";
  return `<div class="kids ${extra}">${t.agents.map(k =>
    `<div class="kid k-${k.state}"><span class="dot"></span><span class="name">${esc(k.name)}</span>${k.persona ? `<span class="tag persona">${esc(k.persona)}</span>` : ""}<span class="desc">${esc(k.desc)}</span>${tokensHtml(k.tokens)}</div>`).join("")}</div>`;
}
// The daemon puts the profile first in the tags: it shows as a pill of its own instead, or not at
// all where the profile has a row of its own.
function tagsHtml(t, noProfile) {
  const profile = t.profile && !noProfile ? `<span class="tag profile" title="Profile">${esc(t.profile)}</span>` : "";
  const tags = t.tags.filter((x, i) => !(i === 0 && x === t.profile));
  const refs = t.links.map(l => l.url
    ? `<a class="tag" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`
    : `<span class="tag mono">${esc(l.label)}</span>`).join("");
  const persona = t.persona ? `<span class="tag persona">${esc(t.persona)}</span>` : "";
  const timer = t.timer_left ? `<span class="tag timer" title="Closed by itself when the timer runs out">\u23f1 ${human(t.timer_left)}</span>` : "";
  const boss = t.parent ? tasks.find(x => x.id === t.parent) : null;
  const color = `--team: ${teamColor(topOf(t))}`, kids = tasks.filter(x => x.parent === t.id).length;
  const parent = t.parent ? `<span class="tag team" style="${color}" title="Driven by ${esc(boss ? boss.title : t.parent)}">\u21b3 ${esc(t.parent.slice(0, 8))}</span>` : "";
  const drives = kids ? `<span class="tag team" style="${color}" title="Drives ${kids} task${kids === 1 ? "" : "s"}">\u25be ${kids}</span>` : "";
  return `<div class="tags">${profile}${drives}${parent}${timer}${tags.map(x => `<span class="tag t-${esc(x)}">${esc(x)}</span>`).join("")}${persona}${refs}</div>`;
}
// whereHtml says where a live session runs: the board's own tmux, yours, or a Herdr pane.
const WHERE = { hc: ["hc", "Live in the board's tmux"], own: ["tmux", "Live in your tmux"], herdr: ["herdr", "Live in a Herdr pane"] };
const whereHtml = t => WHERE[t.tmux] ? `<span class="where w-${t.tmux}" title="${WHERE[t.tmux][1]}">${WHERE[t.tmux][0]}</span>` : "";
const repoHtml = t => t.repo ? `<span class="repo">${esc(t.repo)}</span>` : "";
const closed = t => !t.live && (t.state === "running" || t.state === "needs" || t.state === "review");

// litAt holds when the board saw each task move to Done: it lights up, then fades. A render in the
// middle of the fade picks it up where it was, through a negative delay.
const LIT_MS = 3500; // as long as the board in the terminal
let litAt = {};
function litAttrs(t) {
  const at = litAt[t.id];
  return at && t.state === "done" ? ` data-lit style="--lit: ${at - Date.now()}ms"` : "";
}

function cardHtml(t) {
  const body = t.state === "needs" && t.ask ? `<div class="ask">${esc(t.ask)}</div>` : `<div class="last">${esc(t.last)}</div>`;
  return `<div class="card s-${t.state}"${litAttrs(t)} draggable="true" tabindex="0" role="button" data-id="${t.id}">
    <div class="title"><span>${esc(t.title)}</span>${whereHtml(t)}${closed(t) ? `<span class="chip closed">closed</span>` : ""}</div>
    <div class="meta mono"><span>${t.short}</span>${repoHtml(t)}<span title="Since the task started">${human(t.age)}</span><span class="idle" title="Since the last activity">idle ${human(t.idle)}</span>${ctxHtml(t.context)}${tokensHtml(t.tokens)}${costHtml(t)}</div>
    ${tagsHtml(t)}
    ${body}
    ${kidsHtml(t, "")}
  </div>`;
}

// teamColor is the color of a tree of tasks, picked from the task at its top as the terminal board
// does: FNV-1a of its id.
function teamColor(top) {
  let h = 0x811c9dc5;
  for (const b of new TextEncoder().encode(top)) h = Math.imul(h ^ b, 0x01000193) >>> 0;
  return `var(--team-${h % 6})`;
}
// topOf is the task at the top of the tree a task is in.
function topOf(t) {
  for (const seen = new Set([t.id]); t.parent; ) {
    const up = tasks.find(x => x.id === t.parent);
    if (!up || seen.has(up.id)) break;
    seen.add(up.id); t = up;
  }
  return t.id;
}
// branchHtml draws branches of a tree, or how many tasks a task drives, in the color of its tree.
const branchHtml = (text, top) => text ? `<span class="tree" style="color: ${teamColor(top)}">${text}</span>` : "";
const drivesHtml = (kids, top) => branchHtml(kids ? ` \u25be ${kids}` : "", top);

// tree puts each task right after its parent, as the terminal board does, with the branches down to
// it, the line that runs past its own child rows, how many tasks it drives and the task at the top.
// A task whose parent is not in the list goes at the top.
function tree(list) {
  const ids = new Set(list.map(t => t.id)), kids = {}, out = [], seen = new Set();
  for (const t of list) if (t.parent && t.parent !== t.id && ids.has(t.parent)) (kids[t.parent] ||= []).push(t);
  const add = (t, depth, guide, last, top) => {
    if (seen.has(t.id)) return;
    seen.add(t.id);
    const mine = kids[t.id] || [];
    let branch = guide, below = guide;
    if (depth) { branch += last ? "\u2514\u2500 " : "\u251c\u2500 "; below += last ? "   " : "\u2502  "; }
    out.push({ t, branch, through: (below + (mine.length ? "\u2502" : "")).trimEnd(), kids: mine.length, top: top || t.id });
    mine.forEach((k, i) => add(k, depth + 1, below, i === mine.length - 1, top || t.id));
  };
  for (const t of list) if (!t.parent || !ids.has(t.parent)) add(t, 0, "", true, "");
  for (const t of list) add(t, 0, "", true, "");
  return out;
}

function listHtml() {
  const rows = tree(sorted(tasks)).map(({ t, branch, through, kids: drives, top }) => {
    const kids = t.agents.map((k, i, all) =>
      `<tr class="child s-${k.state}"${litAttrs(t)} data-id="${t.id}"><td>${branchHtml(through, top)}</td><td><span class="st"><span class="dot"></span>${stateName(k.state)}</span></td><td></td><td></td><td>${k.persona ? `<span class="tag persona">${esc(k.persona)}</span>` : ""}</td><td>${human(k.age)}</td><td></td><td></td><td>${tokensHtml(k.tokens)}</td><td></td><td>${i === all.length - 1 ? "└─" : "├─"} ${esc(k.name)}</td><td class="lastcol">${esc(k.desc)}</td></tr>`).join("");
    const last = t.state === "needs" && t.ask ? t.ask : t.last;
    return `<tr class="s-${t.state}"${litAttrs(t)} data-id="${t.id}" tabindex="0"><td>${branchHtml(branch, top)}${t.short}${drivesHtml(drives, top)}</td><td><span class="st"><span class="dot"></span>${esc(t.state_name)}</span></td><td>${whereHtml(t)}</td><td>${repoHtml(t)}</td><td>${tagsHtml(t)}</td><td>${human(t.age)}</td><td>${human(t.idle)}</td><td>${ctxHtml(t.context)}</td><td>${tokensHtml(t.tokens)}</td><td>${costHtml(t)}</td><td class="task">${esc(t.title)}${closed(t) ? ` <span class="chip closed">closed</span>` : ""}</td><td class="lastcol">${esc(last)}</td></tr>${kids}`;
  }).join("");
  return `<table><thead><tr><th>Task</th><th>State</th><th>Where</th><th>Repo</th><th>Tags</th><th>Age</th><th>Idle</th><th>Context</th><th>Tokens</th><th>Cost</th><th>Title</th><th>Last</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function renderBoard() {
  const n = tasks.filter(t => t.state === "needs").length;
  $("#attn").textContent = n ? `${n} waiting for you` : "";
  const sum = { in: 0, out: 0, cache_read: 0, cache_write: 0 };
  for (const t of tasks) for (const k in sum) sum[k] += (t.tokens || {})[k] || 0;
  $("#usage").innerHTML = tokensHtml(sum);
  document.title = (n ? `(${n}) ` : "") + "headcoach";
  document.querySelectorAll("[data-view]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === view)));
  $("#sortby").value = sortBy;
  const el = $("#board");
  if (loaded && !tasks.length) {
    el.className = "";
    el.innerHTML = `<div class="blank"><b>No tasks yet.</b><br>Start a Claude Code session in tmux and send it a prompt: it shows up here as a task.
      You can also add one with New task, or from a shell with <code>hc new "fix the flaky test"</code>.</div>`;
    return;
  }
  const list = view === "list" && !narrow.matches;
  el.className = list ? "list" : "board";
  if (list) { el.innerHTML = listHtml(); return; }
  el.innerHTML = STATES.map(s => {
    const list = (sortBy === "state" ? pinFirst(tasks) : sorted(tasks)).filter(t => t.state === s.id);
    return `<section class="col s-${s.id}" data-state="${s.id}">
      <div class="col-head"><span class="dot"></span><h2>${s.name}</h2><span class="n">${list.length}</span></div>
      <div class="cards">${list.map(cardHtml).join("") || `<div class="empty">Nothing here</div>`}</div>
    </section>`;
  }).join("");
}

/* ---------- drawer ---------- */

function drawerShell() {
  $("#overlay").innerHTML = `<div class="scrim" id="scrim"></div>
  <aside class="drawer" role="dialog" aria-label="Task">
    <div class="d-head" id="d-head"></div>
    <div class="d-body" id="d-body"></div>
    <form class="reply" id="reply">
      <div class="keys" id="footkeys"></div>
      <textarea id="msg" placeholder="Message the agent" aria-label="Message the agent"></textarea>
      <div class="row"><span class="hint" id="hint"></span><button class="btn primary" type="submit" id="send">Send</button></div>
    </form>
  </aside>`;
}

const keysHtml = [["Up", "\u2191"], ["Down", "\u2193"], ["Enter", "Enter"], ["Escape", "Esc"], ["Tab", "Tab"], ["1", "1"], ["2", "2"], ["3", "3"], ["y", "y"], ["n", "n"]]
  .map(([k, label]) => `<button class="btn small" type="button" data-key="${k}">${label}</button>`).join("");

function renderDrawer() {
  const t = detail;
  if (!t) { $("#overlay").innerHTML = ""; return; }
  if (!$("#d-body")) drawerShell();
  const body = $("#d-body");
  const atBottom = body.scrollHeight - body.scrollTop - body.clientHeight < 40;
  // The terminal shows its last lines, where the question is, unless you scrolled up in it.
  const old = $("#screen"), screenAt = old && old.scrollHeight - old.scrollTop - old.clientHeight >= 20 ? [old.scrollTop, old.scrollLeft] : null;
  if (!editingTitle) {
    $("#d-head").innerHTML = `<h2 id="d-title" title="Double-click to rename">${esc(t.title)}</h2>${whereHtml(t)}<button class="btn small" type="button" id="close">Close</button>`;
  }
  const trail = t.history.map(h => `<span><b>${stateName(h.state)}</b> ${clock(h.at)}</span>`).join("<span>&rarr;</span>");
  const names = { you: "You", agent: "Agent", tool: "Tool" };
  // A message the board typed for another agent names its sender, never You.
  const who = x => x.from ? `From ${esc(x.from)}` : names[x.who];
  // Your last prompt stays first in a log it is too old for: the gap says how much was left out.
  const gap = x => x.skipped ? `<div class="gap">… ${x.skipped} turn${x.skipped === 1 ? "" : "s"} …</div>` : "";
  let log = t.log.map(x => (x.html
    ? `<div class="turn ${x.who}${x.from ? " from" : ""} md"><div class="who">${who(x)}</div>${x.html}</div>`
    : `<div class="turn ${x.who}${x.from ? " from" : ""}"><div class="who">${who(x)}</div>${esc(x.text)}</div>`) + gap(x)).join("");
  if (t.state === "needs" && t.ask) log += `<div class="turn ask"><div class="who">Needs you</div>${esc(t.ask)}</div>`;
  if (!log) log = `<div class="empty">${t.session_id ? "Nothing in the session yet." : "No session yet. Start the task to open one."}</div>`;
  const never = !t.session_id;
  const inBoard = t.attach && t.attach.length > 0;  // live in the board's own tmux or in Herdr: entered from a terminal
  const termLabel = t.live ? "Go to terminal" : never ? "Start in tmux" : "Resume in tmux";
  body.innerHTML = `
    <dl class="kv">
      <dt>Task</dt><dd class="mono">${t.id}</dd>
      ${t.session_id && t.session_id !== t.id ? `<dt>Session</dt><dd class="mono">${t.session_id}</dd>` : ""}
      <dt>Repo</dt><dd>${t.repo ? repoHtml(t) : "none"}</dd>
      <dt>Profile</dt><dd>${t.profile ? `<span class="tags"><span class="tag profile">${esc(t.profile)}</span></span>` : "none"}</dd>
      <dt>Branch</dt><dd class="mono">${esc(t.branch || "none")}</dd>
      <dt>Directory</dt><dd class="mono">${esc(t.cwd || "none")}</dd>
      <dt>Tags</dt><dd>${tagsHtml(t, true)}</dd>
      <dt>Context</dt><dd>${ctxHtml(t.context) || "none yet"}</dd>
      <dt>Cost</dt><dd>${costHtml(t) ? costHtml(t) + ` <span class="tok">at API prices</span>` : "not reported"}</dd>
      <dt>Tokens</dt><dd>${tokensHtml(t.tokens) || "none yet"}${tokensHtml(t.agent_tokens) ? ` <span class="tok">(sub-agents: </span>${tokensHtml(t.agent_tokens)}<span class="tok">)</span>` : ""}</dd>
      <dt>Terminal</dt><dd>${whereHtml(t)} ${t.tmux === "herdr" ? `live in Herdr pane <span class="mono">${esc(t.pane)}</span>` : inBoard ? "live in the board's tmux" : t.live ? `live in tmux pane <span class="mono">${esc(t.pane)}</span>` : never ? "not started" : "closed"}</dd>
    </dl>
    <div>
      <div class="label">State</div>
      <div class="trail">${trail}</div>
      <div class="moverow"><label for="moveto">Move to</label>
        <select id="moveto">${STATES.map(s => `<option value="${s.id}"${s.id === t.state ? " selected" : ""}>${s.name}</option>`).join("")}</select>
        ${inBoard && t.tmux !== "herdr" ? "" : `<button class="btn small" type="button" id="term">${termLabel}</button>`}
        <button class="btn small" type="button" id="pin">${t.pinned ? "Unpin" : "Pin to top"}</button>
        <button class="btn small danger" type="button" id="del">${confirmDelete ? "Confirm delete" : "Delete"}</button>
      </div>
    </div>
    ${t.agents.length ? `<div><div class="label">Sub-agents and background jobs</div>${kidsHtml(t, "plain")}</div>` : ""}
    ${teamHtml(team)}
    ${t.handoff && t.handoff.text ? `<div><div class="label">Handoff <span class="tok mono">${esc(t.handoff.path)}, written ${human(Math.max(0, Math.round(Date.now() / 1000 - t.handoff.updated_at)))} ago</span></div><div class="turn md handoff">${t.handoff.html}</div></div>` : ""}
    <div>
      <div class="label">Open in a terminal</div>
      <div class="cmd"><code id="cmdtext">${esc(inBoard ? "hc attach " + t.short : t.resume)}</code><button class="btn small" type="button" id="copy">Copy</button></div>
    </div>
    <div><div class="label">Session</div><div class="log">${log}</div></div>
    ${t.screen ? `<div><div class="label">Terminal, waiting for an answer</div><pre class="screen" id="screen">${esc(t.screen)}</pre>
      <div class="keys">${keysHtml}<span class="sep">Each button presses that key in the session.</span></div></div>` : ""}`;
  body.querySelectorAll(".md a").forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
  if (atBottom) body.scrollTop = body.scrollHeight;
  const screen = $("#screen");
  if (screen) [screen.scrollTop, screen.scrollLeft] = screenAt || [screen.scrollHeight, old ? old.scrollLeft : 0];
  $("#footkeys").innerHTML = t.screen ? keysHtml : "";
  fitDrawer();
  $("#msg").disabled = $("#send").disabled = t.ask_kind === "permission" && !t.can_reply;
  $("#hint").textContent = t.ask_kind === "permission" && !t.can_reply ? "The session is asking for a permission. Answer it with the keys above."
    : !t.can_reply ? "The session is showing a dialog. Answer it with the keys above, or type an answer: it goes in the free text option, if the dialog has one."
    : t.live && t.state === "running" ? "The agent is working. Your message is queued behind the current turn."
    : t.live ? "Your message goes straight to the session."
    : never ? "Sending a message starts the session with it."
    : "The session is closed. Sending a message resumes it in a new tmux window.";
}

// On a phone the drawer covers what the keyboard leaves visible: iOS keeps fixed boxes at full height.
const narrow = matchMedia("(max-width: 640px)");
function fitDrawer() {
  const d = $(".drawer"), vv = window.visualViewport;
  if (!d) return;
  d.style.setProperty("--vv-top", vv ? vv.offsetTop + "px" : "0px");
  d.style.setProperty("--vv-height", vv ? vv.height + "px" : "100dvh");
}
if (window.visualViewport) for (const ev of ["resize", "scroll"]) visualViewport.addEventListener(ev, fitDrawer);

// The tasks the open one drives, at any depth, and what waits on you among them.
function teamHtml(tm) {
  if (!tm || !tm.members.length) return "";
  const top = topOf(tm.task);
  const what = o => o.kind === "needs" ? "asks: " + o.what : o.kind === "review" ? "in Review: " + o.what : o.what;
  const wait = tm.on_you.map(o => `<li><span class="mono">${o.short}</span> ${esc(o.title)}: ${esc(what(o))}</li>`).join("");
  const rows = tm.members.map(m => {
    const q = m.handoff.queue, where = m.handoff.status || (m.state === "needs" ? m.ask : m.last);
    return `<tr class="s-${m.state}" data-id="${m.id}"><td class="mono">${branchHtml(m.tree, top)}${m.short}${drivesHtml(m.kids, top)}</td><td><span class="st"><span class="dot"></span>${esc(m.state_name)}</span></td>
      <td class="q">${q.open + q.done ? `${q.open} open, ${q.done} done` : ""}</td><td>${esc(m.title)}</td><td>${esc(where)}</td></tr>`;
  }).join("");
  return `<div class="team"><div class="label">Team <span class="tok">the tasks it drives</span></div>
    ${wait ? `<div class="label">Waits on you</div><ul class="wait">${wait}</ul>` : ""}<table><tbody>${rows}</tbody></table></div>`;
}

/* ---------- data ---------- */

async function refresh(force) {
  try {
    const data = await api("GET", "/api/tasks");
    $("#conn").classList.remove("down"); $("#conn-text").textContent = "live";
    loaded = true;
    const sig = JSON.stringify(data.tasks.map(t => [t.id, t.parent, t.state, t.title, t.pinned_at, t.last, t.ask, t.live, t.tmux, t.profile, t.repo, t.agents, t.tags, t.links, t.persona, t.tokens, t.context, t.cost, Math.floor(t.age / 60), Math.floor(t.idle / 60), t.timer_left < 60 ? t.timer_left : Math.floor(t.timer_left / 60)]));
    const was = new Map(tasks.map(t => [t.id, t.state])), now = Date.now();
    for (const id in litAt) if (now - litAt[id] >= LIT_MS) delete litAt[id];
    for (const t of data.tasks) if (was.has(t.id) && was.get(t.id) !== "done" && t.state === "done") litAt[t.id] = now;
    tasks = data.tasks;
    renderLimits(data.limits || []);
    if ((sig !== boardSig || force) && !dragId) { boardSig = sig; renderBoard(); }
  } catch (err) {
    $("#conn").classList.add("down"); $("#conn-text").textContent = "daemon not reachable";
  }
  if (openId) {
    try {
      const t = await api("GET", "/api/tasks/" + openId);
      const sig = JSON.stringify([t.state, t.title, t.pinned, t.ask, t.live, t.tmux, t.profile, t.persona, t.pane, t.attach, t.branch, t.agents, t.handoff && t.handoff.updated_at, t.tokens, t.context, t.cost, t.history.length, t.log.length, t.log.slice(-1), t.resume, t.screen, confirmDelete, t.timer_left < 60 ? t.timer_left : Math.floor(t.timer_left / 60)]);
      // A task that drives others shows them too.
      const tm = tasks.some(x => x.parent === t.id) ? await api("GET", `/api/tasks/${t.id}/team`) : null;
      const teamSig = tm && JSON.stringify([tm.on_you, tm.members.map(m => [m.id, m.depth, m.state, m.title, m.handoff, m.state === "needs" ? m.ask : m.last])]);
      detail = t; team = tm;
      if (sig + teamSig !== detailSig || force) { detailSig = sig + teamSig; renderDrawer(); }
    } catch (err) { closeDrawer(); }
  }
}
function openDrawer(id) { openId = id; detail = null; team = null; detailSig = ""; confirmDelete = false; editingTitle = false; $("#overlay").innerHTML = ""; refresh(true); }
function closeDrawer() { openId = null; detail = null; team = null; $("#overlay").innerHTML = ""; }

/* ---------- events ---------- */

document.addEventListener("click", e => {
  const t = e.target;
  if (t.dataset.view) {
    view = t.dataset.view;
    try { localStorage.setItem("view", view); } catch (err) {}
    renderBoard(); return;
  }
  if (t.closest("a")) return;
  const card = t.closest(".card, tr[data-id]");
  if (card) { openDrawer(card.dataset.id); return; }
  if (t.id === "newbtn") { $("#newpanel").hidden = !$("#newpanel").hidden; if (!$("#newpanel").hidden) $("#new-prompt").focus(); return; }
  if (t.id === "newcancel") { $("#newpanel").hidden = true; return; }
  if (t.id === "close" || t.id === "scrim") { closeDrawer(); return; }
  if (t.dataset.key) { act(() => api("POST", `/api/tasks/${openId}/keys`, { keys: [t.dataset.key] })); return; }
  if (t.id === "term") { act(() => api("POST", `/api/tasks/${openId}/focus`)); return; }
  if (t.id === "pin") { act(() => api("PATCH", `/api/tasks/${openId}`, { pinned: !detail.pinned })); return; }
  if (t.id === "del") {
    if (!confirmDelete) { confirmDelete = true; renderDrawer(); return; }
    const id = openId; closeDrawer(); act(() => api("DELETE", `/api/tasks/${id}`)); return;
  }
  if (t.id === "copy") {
    const text = $("#cmdtext").textContent;
    const fallback = () => { const r = document.createRange(); r.selectNodeContents($("#cmdtext")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
    try { navigator.clipboard.writeText(text).then(() => { t.textContent = "Copied"; }, fallback); } catch (err) { fallback(); }
  }
});
document.addEventListener("dblclick", e => {
  if (e.target.id !== "d-title" || !detail) return;
  editingTitle = true;
  $("#d-head").innerHTML = `<input id="d-title-input" value="${esc(detail.title)}" aria-label="Task title"><button class="btn small" type="button" id="close">Close</button>`;
  const input = $("#d-title-input"); input.focus(); input.select();
});
function commitTitle() {
  const input = $("#d-title-input");
  if (!input) return;
  const title = input.value.trim();
  editingTitle = false;
  if (title && detail && title !== detail.title) act(() => api("PATCH", `/api/tasks/${openId}`, { title }));
  else renderDrawer();
}
document.addEventListener("focusout", e => { if (e.target.id === "d-title-input") commitTitle(); });
document.addEventListener("keydown", e => {
  if (e.target.id === "d-title-input") {
    if (e.key === "Enter") { e.preventDefault(); commitTitle(); }
    if (e.key === "Escape") { e.stopPropagation(); editingTitle = false; renderDrawer(); }
    return;
  }
  if (e.key === "Escape") { if (openId) closeDrawer(); else $("#newpanel").hidden = true; }
  if (e.key === "Enter" && e.target.matches && e.target.matches(".card, tr[data-id]")) openDrawer(e.target.dataset.id);
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey) && e.target.id === "msg") $("#reply").requestSubmit();
});
document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "reply") {
    const text = $("#msg").value.trim();
    if (!text) return;
    act(async () => { await api("POST", `/api/tasks/${openId}/reply`, { text }); $("#msg").value = ""; });
  }
  if (e.target.id === "newpanel") {
    const start = !!(e.submitter && e.submitter.dataset.start);
    const data = { prompt: $("#new-prompt").value, cwd: $("#new-dir").value, profile: $("#new-profile").value, start };
    act(async () => { await api("POST", "/api/tasks", data); $("#new-prompt").value = ""; $("#newpanel").hidden = true; });
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "sortby") {
    sortBy = e.target.value;
    try { localStorage.setItem("sort", sortBy); } catch (err) {}
    renderBoard(); return;
  }
  if (e.target.id === "palette") {
    palette = e.target.value;
    try { palette ? localStorage.setItem("palette", palette) : localStorage.removeItem("palette"); } catch (err) {}
    applyPalette(); return;
  }
  if (e.target.id === "moveto") act(() => api("PATCH", `/api/tasks/${openId}`, { state: e.target.value }));
});
document.addEventListener("dragstart", e => {
  const card = e.target.closest && e.target.closest(".card");
  if (!card) return;
  dragId = card.dataset.id; card.classList.add("dragging");
  e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", dragId);
});
document.addEventListener("dragend", () => { dragId = null; renderBoard(); });
document.addEventListener("dragover", e => {
  const col = e.target.closest && e.target.closest(".col");
  if (!col || !dragId) return;
  e.preventDefault();
  document.querySelectorAll(".col.over").forEach(c => c !== col && c.classList.remove("over"));
  col.classList.add("over");
});
document.addEventListener("drop", e => {
  const col = e.target.closest && e.target.closest(".col");
  if (!col || !dragId) return;
  e.preventDefault();
  const id = dragId, state = col.dataset.state;
  dragId = null;
  const t = tasks.find(x => x.id === id);
  if (t && t.state !== state) act(() => api("PATCH", `/api/tasks/${id}`, { state }));
  else renderBoard();
});

async function boot() {
  applyPalette();
  renderBoard();
  try {
    const meta = await api("GET", "/api/meta");
    $("#new-profile").innerHTML = meta.profiles.map(p => `<option>${esc(p)}</option>`).join("");
    $("#dirs").innerHTML = meta.dirs.map(d => `<option value="${esc(d)}"></option>`).join("");
    configTheme = meta.theme || "terminal";
    try { localStorage.setItem("config-palette", configTheme); } catch (err) {}
    applyPalette();
  } catch (err) { if (err.status === 401) return; }
  await refresh(true);
  setInterval(() => { if (!document.hidden) refresh(false); }, POLL_MS);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(false); });
}
narrow.addEventListener("change", () => renderBoard());
boot();
</script>
</body>
</html>
